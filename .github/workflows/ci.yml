name: Test, verify OrcaSlicer and publish package

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '23 4 * * 1'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[test,geometry]'
      - run: python scripts/build_host_plugin.py --check
      - run: python -m pytest -q
      - run: python -m ruff check src scripts tests

  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - name: Install official AppImage runtime dependencies
        run: |
          sudo sed -i 's|^URIs:.*|URIs: https://archive.ubuntu.com/ubuntu|' /etc/apt/sources.list.d/ubuntu.sources
          sudo timeout 120 apt-get -o Dir::Etc::sourceparts="-" -o Dir::Etc::sourcelist="sources.list.d/ubuntu.sources" -o Acquire::Retries=1 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 update -qq || true
          sudo timeout 240 env DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 install -y --no-install-recommends libwebkit2gtk-4.1-0 libmspack0 libsecret-1-0 libopengl0 libglu1-mesa
      - name: Download official engine
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
        run: |
          tag=v2.4.2
          if [[ "$EVENT" == schedule || "$EVENT" == workflow_dispatch ]]; then
            tag=$(gh api repos/OrcaSlicer/OrcaSlicer/releases/latest --jq .tag_name)
          fi
          gh release download "$tag" --repo OrcaSlicer/OrcaSlicer --pattern 'OrcaSlicer_Linux_AppImage_Ubuntu2404_V*.AppImage' --skip-existing
          image=$(find . -maxdepth 1 -name '*.AppImage' ! -iname '*aarch64*' | head -1)
          test -n "$image"
          chmod +x "$image"
          "$image" --appimage-extract > /dev/null
          chmod +x squashfs-root/bin/orca-slicer
      - name: Produce actual G-code and sliced project
        env:
          ORCA_SLICER_BIN: ${{ github.workspace }}/squashfs-root/AppRun
          ORCA_TEST_RESOURCES: ${{ github.workspace }}/squashfs-root/resources
          ORCA_TEST_OUTPUT: ${{ github.workspace }}/smoke-output
          XDG_RUNTIME_DIR: /tmp/rrs-orca-runtime
        run: |
          mkdir -p "$XDG_RUNTIME_DIR"
          chmod 700 "$XDG_RUNTIME_DIR"
          python scripts/smoke_orca.py
          python scripts/verify_resumable_jobs.py
          python scripts/verify_roundtrip.py
          python scripts/verify_extensions.py
          python scripts/verify_semantics.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: real-engine-evidence
          path: smoke-output/

  host_gui:
    strategy:
      fail-fast: false
      matrix:
        section: [all, text, temperature, pressure_advance, retraction, max_volumetric_speed, flow_ratio, vfa, cornering, input_shaping_frequency, input_shaping_damping]
    needs: smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[desktop]' 
      - uses: actions/download-artifact@v4
        with:
          name: real-engine-evidence
          path: host-output
      - name: Install isolated GUI test dependencies
        run: |
          sudo sed -i 's|^URIs:.*|URIs: https://archive.ubuntu.com/ubuntu|' /etc/apt/sources.list.d/ubuntu.sources
          sudo timeout 120 apt-get -o Dir::Etc::sourceparts="-" -o Dir::Etc::sourcelist="sources.list.d/ubuntu.sources" -o Acquire::Retries=1 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 update -qq || true
          sudo timeout 240 env DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 install -y --no-install-recommends libwebkit2gtk-4.1-0 libmspack0 libsecret-1-0 libopengl0 libglu1-mesa libgl1-mesa-dri xvfb xauth xdotool scrot tesseract-ocr dbus-x11 openbox xclip
      - name: Download official nightly without modifying its binary
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download nightly-builds --repo OrcaSlicer/OrcaSlicer --pattern 'OrcaSlicer_Linux_AppImage_Ubuntu2404_nightly.AppImage'
          chmod +x *.AppImage
          ./OrcaSlicer_Linux_AppImage_Ubuntu2404_nightly.AppImage --appimage-extract > /dev/null
          chmod +x squashfs-root/bin/orca-slicer
          sha256sum *.AppImage > nightly-SHA256SUMS
      - name: Verify native plugin, live reads, transactions and project export
        env:
          ORCA_SLICER_BIN: ${{ github.workspace }}/squashfs-root/AppRun
          ORCA_TEST_RESOURCES: ${{ github.workspace }}/squashfs-root/resources
          ORCA_TEST_OUTPUT: ${{ github.workspace }}/host-output
          ORCA_NATIVE_SECTIONS: ${{ matrix.section }}
          XDG_RUNTIME_DIR: /tmp/rrs-host-runtime
          LIBGL_ALWAYS_SOFTWARE: '1'
          WEBKIT_DISABLE_COMPOSITING_MODE: '1'
          XDG_SESSION_TYPE: x11
          SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
        run: |
          mkdir -p "$XDG_RUNTIME_DIR"
          chmod 700 "$XDG_RUNTIME_DIR"
          dbus-run-session -- xvfb-run -a -s '-screen 0 1440x1000x24' sh -c 'openbox --sm-disable >/tmp/rrs-openbox.log 2>&1 & exec python scripts/verify_host_gui.py'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: real-host-plugin-evidence-${{ matrix.section }}
          path: |
            host-output/host-evidence/
            nightly-SHA256SUMS

  package:
    needs: [test, smoke, host_gui]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[test,geometry]' 'setuptools>=77' wheel
      - uses: actions/download-artifact@v4
        with:
          name: real-host-plugin-evidence-all
          path: native-evidence
      - run: python scripts/record_host_evidence.py native-evidence
      - run: python scripts/package.py
      - uses: actions/upload-artifact@v4
        with:
          name: rrs-orcaslicer-mcp-package
          path: dist/
      - name: Publish a new version after successful checks
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          tag="v$version"
          current=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          if [[ "$current" != "$GITHUB_SHA" ]]; then
            echo "A newer source commit exists; only release the current main branch."
            exit 0
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; keeping published assets immutable."
          else
            gh release create "$tag" dist/* --target "$GITHUB_SHA" --title "RRS OrcaSlicer MCP $tag" --notes-file docs/RELEASE.md
          fi

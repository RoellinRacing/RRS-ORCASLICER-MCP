repository_id\":1433942021,\"head_branch\":\"main\",\"head_sha\":\"f45ee121d44688e64c0a4dad2ce220979b78c4e4\"},\"repo\":\"RRS-ORCASLICER-MCP\",\"run_conclusion\":\"failure\"}],\"releases\":[]}")
          root='https://api.github.com/repos/'+m['repository']
          assert os.environ['GITHUB_REPOSITORY']==m['repository']
          def api(path,method='GET',missing=False):
              req=urllib.request.Request(root+path,method=method,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'})
              try:
                  with urllib.request.urlopen(req,timeout=30) as r:
                      b=r.read()
                      return json.loads(b) if b else None
              except urllib.error.HTTPError as e:
                  if e.code==404 and missing:return None
                  raise
          runs={}
          present=[]
          for a in m['artifacts']:
              x=api('/actions/artifacts/'+str(a['id']),missing=True)
              if x is None:continue
              for k in ['id','name','size_in_bytes','digest']:assert x[k]==a[k],(a['id'],k)
              assert x['workflow_run']['id']==a['workflow_run']['id']
              rid=a['workflow_run']['id']
              if rid not in runs:runs[rid]=api('/actions/runs/'+str(rid))
              assert runs[rid]['status']=='completed'
              assert runs[rid]['conclusion']==a['run_conclusion']
              if m['repository'].endswith('RRS-ORCASLICER-MCP'):assert runs[rid]['conclusion'] in ['failure','cancelled']
              present.append(a)
          rels=[]
          for r in m['releases']:
              x=api('/releases/'+str(r['id']),missing=True)
              if x is None:continue
              assert x['tag_name']==r['tag_name']
              actual=[{k:a[k] for k in ['id','name','size','digest']} for a in x['assets']]
              assert sorted(actual,key=lambda a:a['id'])==sorted(r['assets'],key=lambda a:a['id'])
              rels.append(r)
          print('ALL PRECONDITIONS PASSED',len(present),'artifacts',len(rels),'releases',flush=True)
          saved=0
          for a in present:
              path='/actions/artifacts/'+str(a['id'])
              api(path,'DELETE')
              assert api(path,missing=True) is None
              saved+=a['size_in_bytes']
              print('DELETED_ARTIFACT',a['id'],a['size_in_bytes'],flush=True)
          for r in rels:
              path='/releases/'+str(r['id'])
              api(path,'DELETE')
              assert api(path,missing=True) is None
              print('DELETED_RELEASE',r['id'],r['tag_name'],flush=True)
          print('VERIFIED_DELETED_BYTES',saved,flush=True)
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:f.write('Verified deletion: '+str(len(present))+' fixed artifacts ('+str(saved)+' bytes), '+str(len(rels))+' fixed backed-up releases. Source history and tags preserved.\\n')
          

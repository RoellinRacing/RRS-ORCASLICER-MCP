[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "rrs-orcaslicer-mcp"
version = "0.4.0"
description = "Standalone MCP bridge for OrcaSlicer CLI, profiles, 3MF projects and desktop"
readme = "README.md"
requires-python = ">=3.11"
license = "AGPL-3.0-or-later"
dependencies = ["mcp>=1.20,<2"]

[project.optional-dependencies]
geometry = ["trimesh>=4.6,<6", "numpy>=1.26", "scipy>=1.12", "manifold3d>=3,<4", "mapbox-earcut>=1", "shapely>=2", "fast-simplification>=0.1"]
desktop = ["PyAutoGUI>=0.9.54", "Pillow>=10", "pyperclip>=1.9", "psutil>=5.9", "PyGetWindow>=0.0.9; sys_platform == 'win32'"]
test = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.9", "build>=1"]

[project.scripts]
rrs-orcaslicer-mcp = "rrs_orcaslicer_mcp.server:main"

[tool.setuptools.package-data]
rrs_orcaslicer_mcp = ["data/*.json", "data/*.py"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B"]

[tool.ruff.format]
exclude = ["src/rrs_orcaslicer_mcp/data/rrs_orcaslicer_bridge.py"]

